async function login(showResult=true){
    if(!adminConfigured()){
        setUnlocked(false);

        if(
            publicLoaded
            ||state.length
        ){
            render();
        }

        status(
            publicLoaded
                ? 'online'
                : 'offline',
            publicLoaded
                ? '公开浏览'
                : '公开数据不可用'
        );

        lastSyncTime.textContent=
            publicLoaded
                ? '公开浏览 · 编辑需 Token'
                : '公开数据未加载 · 编辑需 Token';

        if(showResult){
            show(
                '请填写仓库和 Token 以启用编辑',
                'error'
            );
        }

        return false;
    }

    status(
        'syncing',
        '验证编辑权限…'
    );

    syncBtn.disabled=true;
    exportBtn.disabled=true;
    importBtn.disabled=true;

    try{
        await verifyRepository();

        const remote=
            await readRemote();

        const remoteFp=
            fingerprint(
                remote.state
            );

        const cache=
            loadCache();

        const sameTarget=
            meta.target===target();

        const cacheFp=
            fingerprint(cache);

        const cacheUnsynced=
            sameTarget
            &&meta.fingerprint!==null
            &&cacheFp!==meta.fingerprint
            &&cacheFp!==remoteFp;

        if(cacheUnsynced){
            state=cache;

            setUnlocked(true);

            render();

            if(
                remote.exists
                &&remoteFp!==meta.fingerprint
            ){
                status(
                    'offline',
                    '存在同步冲突'
                );

                lastSyncTime.textContent=
                    '编辑已登录 · 本地和云端均有修改';

                if(showResult){
                    show(
                        '编辑登录成功，但检测到本地与云端均有修改，请点击“同步”处理',
                        'error'
                    );
                }
            }else{
                status(
                    'offline',
                    '有未同步修改'
                );

                lastSyncTime.textContent=
                    '编辑已登录 · 正在恢复未同步修改';

                scheduleSync();

                if(showResult){
                    show(
                        '编辑登录成功，已恢复本地未同步修改',
                        'success'
                    );
                }
            }
        }else{
            state=remote.state;

            setUnlocked(true);

            render();

            record(
                state,
                remote.sha
            );

            status(
                'online',
                '编辑已登录'
            );

            if(!remote.exists){
                lastSyncTime.textContent=
                    '编辑已登录 · 数据文件尚未创建';
            }

            if(showResult){
                show(
                    'Token 验证成功，已启用编辑',
                    'success'
                );
            }
        }

        await restoreMemoDraftsIfAny();

        return true;
    }catch(error){
        console.error(error);

        setUnlocked(false);

        if(
            publicLoaded
            ||state.length
        ){
            render();
        }

        status(
            publicLoaded
                ? 'online'
                : 'offline',
            publicLoaded
                ? '公开浏览'
                : '公开数据不可用'
        );

        lastSyncTime.textContent=
            publicLoaded
                ? '公开浏览 · Token 验证失败'
                : '公开数据未加载 · Token 验证失败';

        if(showResult){
            show(
                `编辑登录失败：${formatError(error)}`,
                'error'
            );
        }

        return false;
    }
}

/* =========================
   同步
   ========================= */

async function sync(showResult=true,interactive=showResult){
    if(
        !unlocked
        ||!adminConfigured()
    ){
        show(
            '请先使用 Token 登录',
            'error'
        );

        return false;
    }

    if(syncing){
        return false;
    }

    clearTimeout(autoTimer);
    autoTimer=null;

    syncing=true;
    syncBtn.disabled=true;

    status(
        'syncing',
        '同步中…'
    );

    try{
        const localSnapshot=
            normalizeState(state);

        const localFp=
            fingerprint(
                localSnapshot
            );

        const baseline=
            meta.target===target()
                ? meta.fingerprint
                : null;

        const remote=
            await readRemote();

        if(!remote.exists){
            if(
                baseline!==null
                &&interactive
            ){
                const recreate=
                    confirm(
                        '云端数据文件已不存在。\n\n'
                        +'确定：用当前 Memo 数据重新创建云端文件。\n'
                        +'取消：停止同步。'
                    );

                if(!recreate){
                    status(
                        'offline',
                        '同步已取消'
                    );

                    return false;
                }
            }else if(
                baseline!==null
                &&!interactive
            ){
                status(
                    'offline',
                    '云端文件已删除'
                );

                show(
                    '云端文件已删除，请点击“同步”决定是否重新创建',
                    'error'
                );

                return false;
            }

            const sha=
                await writeRemote(
                    localSnapshot,
                    null
                );

            record(
                localSnapshot,
                sha
            );

            status(
                'online',
                '编辑已登录'
            );

            if(showResult){
                show(
                    '同步完成',
                    'success'
                );
            }

            return true;
        }

        const remoteFp=
            fingerprint(
                remote.state
            );

        if(localFp===remoteFp){
            record(
                localSnapshot,
                remote.sha
            );

            status(
                'online',
                '编辑已登录'
            );

            if(showResult){
                show(
                    '本地与云端已一致',
                    'success'
                );
            }

            return true;
        }

        const localChanged=
            baseline===null
            ||localFp!==baseline;

        const remoteChanged=
            baseline===null
            ||remoteFp!==baseline;

        if(
            baseline!==null
            &&localChanged
            &&!remoteChanged
        ){
            const sha=
                await writeRemote(
                    localSnapshot,
                    remote.sha
                );

            record(
                localSnapshot,
                sha
            );

            status(
                'online',
                '编辑已登录'
            );

            if(showResult){
                show(
                    '同步完成',
                    'success'
                );
            }

            return true;
        }

        if(
            baseline!==null
            &&!localChanged
            &&remoteChanged
        ){
            state=remote.state;

            render();

            record(
                state,
                remote.sha
            );

            status(
                'online',
                '编辑已登录'
            );

            if(showResult){
                show(
                    '已采用云端最新数据',
                    'success'
                );
            }

            return true;
        }

        if(!interactive){
            status(
                'offline',
                '存在同步冲突'
            );

            show(
                '本地和云端都发生了修改，请点击“同步”选择版本',
                'error'
            );

            return false;
        }

        const useLocal=
            confirm(
                '检测到本地和云端数据不同。\n\n'
                +'确定：用当前网页数据覆盖云端。\n'
                +'取消：继续选择是否采用云端数据。'
            );

        if(useLocal){
            const sha=
                await writeRemote(
                    localSnapshot,
                    remote.sha
                );

            record(
                localSnapshot,
                sha
            );

            status(
                'online',
                '编辑已登录'
            );

            show(
                '已用当前网页数据覆盖云端',
                'success'
            );

            return true;
        }

        const useRemote=
            confirm(
                '是否采用云端数据覆盖当前网页？\n\n'
                +'确定：采用云端最新数据。\n'
                +'取消：暂不处理。'
            );

        if(useRemote){
            state=remote.state;

            render();

            record(
                state,
                remote.sha
            );

            status(
                'online',
                '编辑已登录'
            );

            show(
                '已采用云端数据',
                'success'
            );

            return true;
        }

        status(
            'offline',
            '同步已取消'
        );

        show(
            '未覆盖本地或云端数据',
            'info'
        );

        return false;
    }catch(error){
        console.error(error);

        status(
            'offline',
            '同步失败'
        );

        show(
            `同步失败：${formatError(error)}`,
            'error'
        );

        return false;
    }finally{
        syncing=false;
        syncBtn.disabled=!unlocked;
    }
}

function scheduleSync(){
    saveCache();

    if(!unlocked){
        return;
    }

    clearTimeout(autoTimer);

    autoTimer=
        setTimeout(()=>{
            autoTimer=null;
            sync(false,false);
        },AUTO_DELAY);
}

function markLocalChange(){
    render();

    status(
        'offline',
        '待同步'
    );

    lastSyncTime.textContent=
        '有未同步修改';

    scheduleSync();
}

/* =========================
   编辑器基础处理
   无可见格式工具栏
   ========================= */

function selectionInside(editor){
    const sel=
        window.getSelection();

    if(
        !sel
        ||sel.rangeCount===0
    ){
        return false;
    }

    const range=
        sel.getRangeAt(0);

    return editor.contains(
        range.startContainer
    )
    &&editor.contains(
        range.endContainer
    );
}

function currentBlock(editor){
    const sel=
        window.getSelection();

    let node=
        sel?.anchorNode
        ||null;

    if(
        node
        &&node.nodeType===Node.TEXT_NODE
    ){
        node=node.parentElement;
    }

    while(
        node
        &&node!==editor
    ){
        if(
            node.nodeType===Node.ELEMENT_NODE
            &&[
                'P',
                'DIV',
                'LI',
                'BLOCKQUOTE'
            ].includes(node.tagName)
        ){
            return node;
        }

        node=node.parentElement;
    }

    return null;
}

function ensureEditorSelection(editor){
    editor.focus();

    if(selectionInside(editor)){
        return;
    }

    const range=
        document.createRange();

    range.selectNodeContents(editor);
    range.collapse(false);

    const sel=
        window.getSelection();

    sel.removeAllRanges();
    sel.addRange(range);
}

function rememberEditorRange(editor){
    const sel=
        window.getSelection();

    if(
        !sel
        ||sel.rangeCount===0
    ){
        return false;
    }

    const range=
        sel.getRangeAt(0);

    if(
        !editor.contains(
            range.startContainer
        )
        ||!editor.contains(
            range.endContainer
        )
    ){
        return false;
    }

    savedEditorRanges.set(
        editor,
        range.cloneRange()
    );

    return true;
}

function restoreEditorRange(editor){
    editor.focus({
        preventScroll:true
    });

    const range=
        savedEditorRanges.get(editor);

    if(!range){
        return ensureEditorSelection(editor);
    }

    try{
        if(
            !editor.contains(
                range.startContainer
            )
            ||!editor.contains(
                range.endContainer
            )
        ){
            throw new Error(
                'stale range'
            );
        }

        const sel=
            window.getSelection();

        sel.removeAllRanges();

        sel.addRange(
            range.cloneRange()
        );
    }catch(error){
        savedEditorRanges.delete(editor);
        ensureEditorSelection(editor);
    }
}

function createEditorParagraph(inheritIndent=false){
    const block=
        document.createElement('div');

    block.classList.add(
        'editor-paragraph'
    );

    if(inheritIndent){
        block.classList.add(
            'first-line-indent'
        );
    }

    return block;
}

function tagNestedEditorParagraphs(container){
    for(
        const block
        of container.querySelectorAll('p,div')
    ){
        if(
            block.querySelector(
                ':scope > p,:scope > div'
            )
        ){
            continue;
        }

        block.classList.add(
            'editor-paragraph'
        );
    }
}

function normalizeEditorParagraphModel(editor){
    const source=[
        ...editor.childNodes
    ];

    if(!source.length){
        return;
    }

    const output=
        document.createDocumentFragment();

    let paragraph=null;
    let paragraphInheritedIndent=false;

    const ensureParagraph=(inheritIndent=false)=>{
        if(!paragraph){
            paragraph=
                createEditorParagraph(
                    inheritIndent
                );

            paragraphInheritedIndent=
                inheritIndent;
        }else if(
            inheritIndent
            &&!paragraphInheritedIndent
        ){
            paragraph.classList.add(
                'first-line-indent'
            );

            paragraphInheritedIndent=true;
        }

        return paragraph;
    };

    const flush=(forceBlank=false)=>{
        if(
            !paragraph
            &&forceBlank
        ){
            paragraph=
                createEditorParagraph(false);
        }

        if(!paragraph){
            return;
        }

        if(!paragraph.childNodes.length){
            paragraph.appendChild(
                document.createElement('br')
            );
        }

        output.appendChild(paragraph);

        paragraph=null;
        paragraphInheritedIndent=false;
    };

    const appendDirectText=(
        node,
        inheritIndent=false
    )=>{
        const value=
            String(
                node.nodeValue??''
            ).replace(/\r\n?/g,'\n');

        if(!value.includes('\n')){
            ensureParagraph(
                inheritIndent
            ).appendChild(node);

            return;
        }

        const parts=
            value.split('\n');

        node.remove();

        parts.forEach(
            (part,index)=>{
                if(part){
                    ensureParagraph(
                        inheritIndent
                    ).appendChild(
                        document.createTextNode(
                            part
                        )
                    );
                }

                if(
                    index
                    <parts.length-1
                ){
                    flush(true);
                }
            }
        );
    };

    const processNodes=(
        nodes,
        inheritIndent=false
    )=>{
        for(const node of nodes){
            if(
                node.nodeType
                ===Node.TEXT_NODE
            ){
                appendDirectText(
                    node,
                    inheritIndent
                );

                continue;
            }

            if(
                node.nodeType
                !==Node.ELEMENT_NODE
            ){
                node.remove();
                continue;
            }

            const tag=
                node.tagName.toUpperCase();

            if(tag==='BR'){
                node.remove();
                flush(true);
                continue;
            }

            if(tag==='P'){
                flush();

                const block=
                    createEditorParagraph(
                        inheritIndent
                        ||node.classList.contains(
                            'first-line-indent'
                        )
                    );

                while(node.firstChild){
                    block.appendChild(
                        node.firstChild
                    );
                }

                if(!block.childNodes.length){
                    block.appendChild(
                        document.createElement(
                            'br'
                        )
                    );
                }

                node.remove();

                output.appendChild(block);

                continue;
            }

            if(tag==='DIV'){
                const nestedParagraphs=
                    [...node.children]
                        .some(
                            child=>
                                child.tagName==='P'
                                ||child.tagName==='DIV'
                        );

                if(nestedParagraphs){
                    flush();

                    const children=[
                        ...node.childNodes
                    ];

                    const nextIndent=
                        inheritIndent
                        ||node.classList.contains(
                            'first-line-indent'
                        );

                    node.remove();

                    processNodes(
                        children,
                        nextIndent
                    );
                }else{
                    flush();

                    node.classList.add(
                        'editor-paragraph'
                    );

                    if(inheritIndent){
                        node.classList.add(
                            'first-line-indent'
                        );
                    }

                    if(!node.childNodes.length){
                        node.appendChild(
                            document.createElement(
                                'br'
                            )
                        );
                    }

                    output.appendChild(node);
                }

                continue;
            }

            if(
                [
                    'UL',
                    'OL',
                    'BLOCKQUOTE',
                    'TABLE',
                    'HR'
                ].includes(tag)
            ){
                flush();

                tagNestedEditorParagraphs(
                    node
                );

                output.appendChild(node);

                continue;
            }

            ensureParagraph(
                inheritIndent
            ).appendChild(node);
        }
    };

    processNodes(
        source,
        false
    );

    flush();

    editor.replaceChildren(
        output
    );
}

function createSelectionMarker(kind){
    const marker=
        document.createElement('span');

    marker.dataset.editorSelectionMarker=
        kind;

    marker.setAttribute(
        'aria-hidden',
        'true'
    );

    marker.style.cssText=
        'display:inline-block;'
        +'width:0;'
        +'height:0;'
        +'overflow:hidden;'
        +'line-height:0;'
        +'pointer-events:none;';

    return marker;
}

function insertSelectionMarkers(editor,range){
    const collapsed=
        range.collapsed;

    const startMarker=
        createSelectionMarker(
            'start'
        );

    const endMarker=
        collapsed
            ? null
            : createSelectionMarker(
                'end'
            );

    if(endMarker){
        const endRange=
            range.cloneRange();

        endRange.collapse(false);
        endRange.insertNode(
            endMarker
        );
    }

    const startRange=
        range.cloneRange();

    startRange.collapse(true);
    startRange.insertNode(
        startMarker
    );

    return{
        startMarker,
        endMarker,
        collapsed
    };
}

function restoreSelectionFromMarkers(editor,bookmark){
    const{
        startMarker,
        endMarker,
        collapsed
    }=bookmark;

    const sel=
        window.getSelection();

    if(
        !sel
        ||!startMarker.isConnected
    ){
        return false;
    }

    const range=
        document.createRange();

    if(collapsed){
        range.setStartBefore(
            startMarker
        );

        range.collapse(true);
    }else if(endMarker?.isConnected){
        range.setStartAfter(
            startMarker
        );

        range.setEndBefore(
            endMarker
        );
    }else{
        return false;
    }

    sel.removeAllRanges();
    sel.addRange(range);

    startMarker.remove();
    endMarker?.remove();

    editor.normalize();

    return true;
}

function normalizeEditorParagraphModelPreservingSelection(editor){
    const sel=
        window.getSelection();

    if(
        !sel
        ||sel.rangeCount===0
        ||!selectionInside(editor)
    ){
        normalizeEditorParagraphModel(editor);
        return false;
    }

    const bookmark=
        insertSelectionMarkers(
            editor,
            sel.getRangeAt(0)
                .cloneRange()
        );

    normalizeEditorParagraphModel(
        editor
    );

    return restoreSelectionFromMarkers(
        editor,
        bookmark
    );
}

/*
这些格式处理函数继续保留，因此已有格式数据和公式逻辑不会失效。
页面不再显示可见格式按钮。
*/
function editorParagraphForNode(editor,node){
    let current=
        node?.nodeType===Node.ELEMENT_NODE
            ? node
            : node?.parentElement;

    while(
        current
        &&current!==editor
    ){
        if(
            current.nodeType===Node.ELEMENT_NODE
            &&current.classList.contains(
                'editor-paragraph'
            )
        ){
            return current;
        }

        current=current.parentElement;
    }

    return null;
}

function paragraphsTouchedByBookmark(editor,bookmark){
    const{
        startMarker,
        endMarker,
        collapsed
    }=bookmark;

    const paragraphs=[
        ...editor.querySelectorAll(
            '.editor-paragraph'
        )
    ];

    if(collapsed){
        const block=
            editorParagraphForNode(
                editor,
                startMarker
            );

        return block
            ? [block]
            : [];
    }

    if(!endMarker?.isConnected){
        return [];
    }

    const startBlock=
        editorParagraphForNode(
            editor,
            startMarker
        );

    const endBlock=
        editorParagraphForNode(
            editor,
            endMarker
        );

    if(
        !startBlock
        ||!endBlock
    ){
        return [];
    }

    const startIndex=
        paragraphs.indexOf(
            startBlock
        );

    const endIndex=
        paragraphs.indexOf(
            endBlock
        );

    if(
        startIndex<0
        ||endIndex<0
    ){
        return [];
    }

    const from=
        Math.min(
            startIndex,
            endIndex
        );

    const to=
        Math.max(
            startIndex,
            endIndex
        );

    return paragraphs.slice(
        from,
        to+1
    );
}

function toggleFirstLineIndent(editor){
    restoreEditorRange(editor);

    const sel=
        window.getSelection();

    if(
        !sel
        ||sel.rangeCount===0
        ||!selectionInside(editor)
    ){
        show(
            '请将光标放在正文段落中，或选择一个/多个自然段',
            'info'
        );

        return;
    }

    const bookmark=
        insertSelectionMarkers(
            editor,
            sel.getRangeAt(0)
                .cloneRange()
        );

    normalizeEditorParagraphModel(
        editor
    );

    const blocks=
        paragraphsTouchedByBookmark(
            editor,
            bookmark
        );

    if(!blocks.length){
        restoreSelectionFromMarkers(
            editor,
            bookmark
        );

        show(
            '没有识别到可缩进的自然段',
            'info'
        );

        return;
    }

    const shouldIndent=
        blocks.some(
            block=>
                !block.classList.contains(
                    'first-line-indent'
                )
        );

    for(const block of blocks){
        block.classList.toggle(
            'first-line-indent',
            shouldIndent
        );
    }

    restoreSelectionFromMarkers(
        editor,
        bookmark
    );

    editor.dispatchEvent(
        new Event(
            'input',
            {bubbles:true}
        )
    );

    rememberEditorRange(editor);
}

function toggleQuote(editor){
    ensureEditorSelection(editor);

    const block=
        currentBlock(editor);

    document.execCommand(
        'formatBlock',
        false,
        block?.tagName==='BLOCKQUOTE'
            ? 'p'
            : 'blockquote'
    );
}

function insertTable(editor){
    rememberEditorRange(editor);

    const rowsRaw=
        prompt(
            '表格行数（1–20）',
            '3'
        );

    if(rowsRaw===null){
        return;
    }

    const colsRaw=
        prompt(
            '表格列数（1–12）',
            '3'
        );

    if(colsRaw===null){
        return;
    }

    const rows=
        Number.parseInt(
            rowsRaw,
            10
        );

    const cols=
        Number.parseInt(
            colsRaw,
            10
        );

    if(
        !Number.isInteger(rows)
        ||rows<1
        ||rows>20
        ||!Number.isInteger(cols)
        ||cols<1
        ||cols>12
    ){
        show(
            '请输入有效的表格行列数',
            'error'
        );

        return;
    }

    restoreEditorRange(editor);

    let html=
        '<table><tbody>';

    for(
        let r=0;
        r<rows;
        r++
    ){
        html+='<tr>';

        for(
            let c=0;
            c<cols;
            c++
        ){
            html+=
                r===0
                    ? '<th>&nbsp;</th>'
                    : '<td>&nbsp;</td>';
        }

        html+='</tr>';
    }

    html+=
        '</tbody></table><p><br></p>';

    document.execCommand(
        'insertHTML',
        false,
        html
    );

    editor.dispatchEvent(
        new Event(
            'input',
            {bubbles:true}
        )
    );
}

function insertMathMarkup(editor,display=false){
    editor.focus();

    const sel=
        window.getSelection();

    let range=null;

    if(sel&&sel.rangeCount){
        const candidate=
            sel.getRangeAt(0);

        if(
            editor.contains(
                candidate.commonAncestorContainer
            )
        ){
            range=candidate;
        }
    }

    if(!range){
        range=
            document.createRange();

        range.selectNodeContents(
            editor
        );

        range.collapse(false);
    }

    const mark=
        display
            ? '$$'
            : '$';

    const selected=
        range.toString();

    const node=
        document.createTextNode(
            mark
            +selected
            +mark
        );

    range.deleteContents();
    range.insertNode(node);

    const caret=
        document.createRange();

    if(selected){
        caret.setStartAfter(node);
    }else{
        caret.setStart(
            node,
            mark.length
        );
    }

    caret.collapse(true);

    if(sel){
        sel.removeAllRanges();
        sel.addRange(caret);
    }

    editor.dispatchEvent(
        new Event(
            'input',
            {bubbles:true}
        )
    );
}

function applyInlineNote(editor){
    const sel=
        window.getSelection();

    if(
        !sel
        ||sel.rangeCount===0
    ){
        return;
    }

    const range=
        sel.getRangeAt(0);

    if(
        range.collapsed
        ||!editor.contains(
            range.commonAncestorContainer
        )
    ){
        show(
            '请先选择要设为备注的正文文字',
            'info'
        );

        return;
    }

    const walker=
        document.createTreeWalker(
            editor,
            NodeFilter.SHOW_TEXT
        );

    const segments=[];

    while(walker.nextNode()){
        const node=
            walker.currentNode;

        if(
            !range.intersectsNode(node)
            ||!node.nodeValue
        ){
            continue;
        }

        let start=0;
        let end=node.nodeValue.length;

        if(
            node===range.startContainer
        ){
            start=range.startOffset;
        }

        if(
            node===range.endContainer
        ){
            end=range.endOffset;
        }

        if(start<end){
            segments.push({
                node,
                start,
                end
            });
        }
    }

    if(!segments.length){
        show(
            '请先选择要设为备注的正文文字',
            'info'
        );

        return;
    }

    const wrapped=[];

    for(const segment of segments){
        let node=segment.node;

        if(
            segment.end
            <node.nodeValue.length
        ){
            node.splitText(
                segment.end
            );
        }

        if(segment.start>0){
            node=
                node.splitText(
                    segment.start
                );
        }

        if(
            node.parentElement
                ?.classList
                .contains('inline-note')
        ){
            wrapped.push(
                node.parentElement
            );

            continue;
        }

        const span=
            document.createElement(
                'span'
            );

        span.className='inline-note';

        node.replaceWith(span);
        span.appendChild(node);

        wrapped.push(span);
    }

    if(wrapped.length){
        const nextRange=
            document.createRange();

        nextRange.setStartBefore(
            wrapped[0]
        );

        nextRange.setEndAfter(
            wrapped[
                wrapped.length-1
            ]
        );

        sel.removeAllRanges();
        sel.addRange(nextRange);
    }

    editor.dispatchEvent(
        new Event(
            'input',
            {bubbles:true}
        )
    );

    editor.focus();
}

function runEditorAction(editor,button){
    restoreEditorRange(editor);

    const command=
        button.dataset.command;

    const action=
        button.dataset.action;

    if(command){
        document.execCommand(
            command,
            false,
            null
        );
    }else if(action==='indent'){
        toggleFirstLineIndent(editor);
    }else if(action==='quote'){
        toggleQuote(editor);
    }else if(action==='note'){
        applyInlineNote(editor);
        return;
    }else if(action==='inlineMath'){
        insertMathMarkup(
            editor,
            false
        );
        return;
    }else if(action==='displayMath'){
        insertMathMarkup(
            editor,
            true
        );
        return;
    }else if(action==='table'){
        insertTable(editor);
        return;
    }else if(action==='hr'){
        document.execCommand(
            'insertHorizontalRule',
            false,
            null
        );
    }

    editor.focus();
}

/* =========================
   编辑框滚动条
   ========================= */

function setupEditorScrollIndicator(editor){
    const wrap=
        editor.closest(
            '.rich-editor-wrap'
        );

    if(!wrap){
        return;
    }

    const track=
        document.createElement(
            'div'
        );

    const thumb=
        document.createElement(
            'div'
        );

    track.className=
        'rich-editor-scrollbar';

    thumb.className=
        'rich-editor-scrollbar-thumb';

    track.setAttribute(
        'aria-hidden',
        'true'
    );

    track.appendChild(thumb);

    wrap.appendChild(track);

    let raf=0;
    let drag=null;

    const metrics=()=>{
        const clientHeight=
            editor.clientHeight;

        const scrollHeight=
            editor.scrollHeight;

        const trackHeight=
            Math.max(
                24,
                clientHeight-12
            );

        const thumbHeight=
            Math.max(
                34,
                Math.min(
                    trackHeight,
                    trackHeight
                    *clientHeight
                    /Math.max(
                        scrollHeight,
                        1
                    )
                )
            );

        const maxScroll=
            Math.max(
                0,
                scrollHeight-clientHeight
            );

        const maxThumbTravel=
            Math.max(
                0,
                trackHeight-thumbHeight
            );

        return{
            clientHeight,
            scrollHeight,
            trackHeight,
            thumbHeight,
            maxScroll,
            maxThumbTravel
        };
    };

    const update=()=>{
        raf=0;

        const m=metrics();

        const overflow=
            m.clientHeight>0
            &&m.scrollHeight
                >m.clientHeight+2;

        track.classList.toggle(
            'visible',
            overflow
        );

        if(!overflow){
            return;
        }

        const thumbY=
            m.maxScroll>0
                ? (
                    editor.scrollTop
                    /m.maxScroll
                )
                *m.maxThumbTravel
                : 0;

        track.style.top=
            `${editor.offsetTop+6}px`;

        track.style.height=
            `${m.trackHeight}px`;

        thumb.style.height=
            `${m.thumbHeight}px`;

        thumb.style.transform=
            `translateY(${thumbY}px)`;
    };

    const scheduleUpdate=()=>{
        if(raf){
            return;
        }

        raf=
            requestAnimationFrame(
                update
            );
    };

    editor.addEventListener(
        'editor-scroll-refresh',
        scheduleUpdate
    );

    editor.addEventListener(
        'scroll',
        scheduleUpdate,
        {passive:true}
    );

    editor.addEventListener(
        'input',
        scheduleUpdate
    );

    window.addEventListener(
        'resize',
        scheduleUpdate,
        {passive:true}
    );

    if(window.visualViewport){
        window.visualViewport
            .addEventListener(
                'resize',
                scheduleUpdate,
                {passive:true}
            );
    }

    if('ResizeObserver' in window){
        new ResizeObserver(
            scheduleUpdate
        ).observe(editor);
    }

    new MutationObserver(
        scheduleUpdate
    ).observe(
        editor,
        {
            childList:true,
            subtree:true,
            characterData:true
        }
    );

    track.addEventListener(
        'pointerdown',
        event=>{
            if(
                !track.classList.contains(
                    'visible'
                )
            ){
                return;
            }

            event.preventDefault();

            const m=metrics();

            const rect=
                track.getBoundingClientRect();

            if(event.target===thumb){
                drag={
                    pointerId:event.pointerId,
                    startY:event.clientY,
                    startScrollTop:
                        editor.scrollTop,
                    maxScroll:
                        m.maxScroll,
                    maxThumbTravel:
                        m.maxThumbTravel
                };

                thumb.setPointerCapture?.(
                    event.pointerId
                );

                return;
            }

            if(
                m.maxThumbTravel<=0
                ||m.maxScroll<=0
            ){
                return;
            }

            const y=
                Math.max(
                    0,
                    Math.min(
                        m.maxThumbTravel,
                        event.clientY
                        -rect.top
                        -m.thumbHeight/2
                    )
                );

            editor.scrollTop=
                (
                    y
                    /m.maxThumbTravel
                )
                *m.maxScroll;

            scheduleUpdate();
        }
    );

    thumb.addEventListener(
        'pointermove',
        event=>{
            if(
                !drag
                ||event.pointerId
                    !==drag.pointerId
            ){
                return;
            }

            event.preventDefault();

            if(
                drag.maxThumbTravel<=0
                ||drag.maxScroll<=0
            ){
                return;
            }

            const deltaY=
                event.clientY
                -drag.startY;

            editor.scrollTop=
                drag.startScrollTop
                +(
                    deltaY
                    /drag.maxThumbTravel
                )
                *drag.maxScroll;

            scheduleUpdate();
        }
    );

    const endDrag=event=>{
        if(
            !drag
            ||event.pointerId
                !==drag.pointerId
        ){
            return;
        }

        drag=null;
    };

    thumb.addEventListener(
        'pointerup',
        endDrag
    );

    thumb.addEventListener(
        'pointercancel',
        endDrag
    );

    scheduleUpdate();
}

function setupRichEditor(editor){
    setupEditorScrollIndicator(
        editor
    );

    editor.addEventListener(
        'input',
        event=>{
            if(
                event.inputType
                ==='insertParagraph'
            ){
                normalizeEditorParagraphModelPreservingSelection(
                    editor
                );
            }
        }
    );

    editor.addEventListener(
        'paste',
        event=>{
            event.preventDefault();

            const plain=
                event.clipboardData
                    ?.getData(
                        'text/plain'
                    )
                ||'';

            const html=
                event.clipboardData
                    ?.getData(
                        'text/html'
                    )
                ||'';

            const text=
                clipboardTextForEditor(
                    plain,
                    html
                );

            document.execCommand(
                'insertText',
                false,
                text
            );

            normalizeEditorParagraphModelPreservingSelection(
                editor
            );
        }
    );
}

async function addEntry(){
    if(
        !unlocked
        ||addBtn.disabled
    ){
        return;
    }

    const initialContent=
        getEditorHtml(
            contentInput
        );

    if(
        !hasMeaningfulContent(
            initialContent
        )
    ){
        show(
            '请输入正文',
            'error'
        );

        contentInput.focus();

        return;
    }

    const id=uid();

    addBtn.disabled=true;

    try{
        const content=
            getEditorHtml(
                contentInput
            );

        /*
        发布日期仅在首次新增时产生。
        后续编辑 saveEdit() 不修改 createdAt。
        */
        state.push({
            id,
            attachmentFolder:null,
            title:'',
            source:'',
            content,
            contentFormat:'html',
            createdAt:
                new Date()
                    .toISOString()
        });

        await persistWorkingCopyNow(
            state
        );

        await clearAddDraft();

        contentInput.innerHTML='';

        addDraftLastSnapshot=
            addDraftSnapshot();

        markLocalChange();

        contentInput.focus();

        show(
            '已提交',
            'success'
        );
    }catch(error){
        console.error(error);

        show(
            `提交失败：${formatError(error)}`,
            'error'
        );
    }finally{
        addBtn.disabled=false;
    }
}

function editSnapshot(){
    return JSON.stringify({
        content:getEditorHtml(
            editContent
        )
    });
}

function closeEditModal(clearDraft=true){
    stopEditDraftAutosave();

    if(clearDraft){
        clearEditDraft();
    }

    editingId='';
    editInitialSnapshot='';
    editOverlayPointer=null;

    editModal.classList.add(
        'hidden'
    );
}

function openEdit(id){
    if(!unlocked){
        return;
    }

    const item=
        state.find(
            x=>x.id===id
        );

    if(!item){
        return;
    }

    editingId=id;

    setEditorHtml(
        editContent,
        item.content
    );

    editInitialSnapshot=
        editSnapshot();

    editModal.classList.remove(
        'hidden'
    );

    requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
            editContent.dispatchEvent(
                new Event(
                    'editor-scroll-refresh'
                )
            );

            const dialogScroll=
                editModal.querySelector(
                    '.dialog-scroll'
                );

            if(dialogScroll){
                dialogScroll.scrollTop=0;
            }
        });
    });

    editDraftLastSnapshot='';

    startEditDraftAutosave();

    setTimeout(
        ()=>editContent.focus(),
        30
    );
}

async function saveEdit(){
    if(
        !unlocked
        ||editSave.disabled
    ){
        return;
    }

    const item=
        state.find(
            x=>x.id===editingId
        );

    if(!item){
        return;
    }

    const initialContent=
        getEditorHtml(
            editContent
        );

    if(
        !hasMeaningfulContent(
            initialContent
        )
    ){
        show(
            '正文不能为空',
            'error'
        );

        editContent.focus();

        return;
    }

    editSave.disabled=true;

    try{
        const content=
            getEditorHtml(
                editContent
            );

        item.title='';
        item.content=content;
        item.contentFormat='html';

        /*
        注意：
        这里故意不修改 item.createdAt。
        因此编辑正文不会改变发布日期，
        也不会改变按发布时间排序的位置。
        */

        stopEditDraftAutosave();

        await persistWorkingCopyNow(
            state
        );

        await clearEditDraft();

        closeEditModal(false);

        markLocalChange();

        show(
            '已保存',
            'success'
        );
    }catch(error){
        console.error(error);

        if(
            !editModal.classList.contains(
                'hidden'
            )
            &&editingId
        ){
            startEditDraftAutosave();
        }

        show(
            `保存失败：${formatError(error)}`,
            'error'
        );
    }finally{
        editSave.disabled=false;
    }
}

async function deleteEntry(id){
    if(!unlocked){
        return false;
    }

    const item=
        state.find(
            x=>x.id===id
        );

    if(!item){
        return false;
    }

    if(
        !confirm(
            '确定删除这条 Memo 吗？'
        )
    ){
        return false;
    }

    try{
        /*
        兼容旧 Memo 中可能存在的附件目录。
        新版已经没有图片上传入口。
        */
        await deleteAttachmentFolder(
            item.attachmentFolder
        );

        state=
            state.filter(
                x=>x.id!==id
            );

        await persistWorkingCopyNow(
            state
        );

        markLocalChange();

        show(
            '已删除',
            'success'
        );

        return true;
    }catch(error){
        console.error(error);

        show(
            `删除失败：${formatError(error)}`,
            'error'
        );

        return false;
    }
}

/* =========================
   导入导出
   ========================= */

const BACKUP_FORMAT=
    'memo-html-backup';

const BACKUP_DATA_ID=
    'memo-backup-data';

const EXPORT_SITE_NAME=
    'memo';

function exportUnixTimestamp(){
    const timestamp=
        Math.floor(
            Date.now()/1000
        );

    if(
        !Number.isSafeInteger(timestamp)
        ||timestamp<UNIX_FOLDER_MIN
        ||timestamp>UNIX_FOLDER_MAX
    ){
        throw new Error(
            '当前时间无法生成 10 位 Unix 导出时间戳'
        );
    }

    return String(timestamp);
}

function backupJsonForHtml(payload){
    return JSON.stringify(
        payload,
        null,
        2
    )
        .replace(/&/g,'\\u0026')
        .replace(/</g,'\\u003c')
        .replace(/>/g,'\\u003e');
}

function buildBackupHtml(payload){
    const exportedAt=
        payload.exportedAt;

    const exportedUnix=
        payload.exportedAtUnix;

    const entries=
        normalizeState(
            payload.entries
        );

    const memoHtml=
        entries.length
            ? entries.map(item=>`
                <article class="backup-memo">
                    <div class="backup-content">${
                        renderMarkdownLinks(
                            item.content
                        )
                    }</div>

                    <dl class="backup-meta">
                        <div>
                            <dt>发布日期</dt>
                            <dd>${
                                esc(
                                    formatDate(
                                        item.createdAt
                                    )
                                )
                            }</dd>
                        </div>

                        ${
                            item.source
                                ? `<div>
                                    <dt>来源</dt>
                                    <dd>${esc(item.source)}</dd>
                                </div>`
                                : ''
                        }
                    </dl>
                </article>
            `).join('')
            : '<p class="empty">导出时没有 Memo 数据。</p>';

    const backupData=
        backupJsonForHtml({
            ...payload,
            entries
        });

    const backupScript=
        '<script id="'
        +BACKUP_DATA_ID
        +'" type="application/json" data-memo-backup="true">'
        +backupData
        +'</scr'
        +'ipt>';

    return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="memo-backup-format" content="${BACKUP_FORMAT}">
<meta name="memo-backup-exported-unix" content="${attr(exportedUnix)}">
<title>Memo Backup ${attr(exportedUnix)}</title>
<style>

    margin:0;
    background:#f5f7fa;
    color:#0f172a;
    font-family:"Times New Roman","Microsoft YaHei","PingFang SC",serif;

}

    width:min(100% - 24px,1000px);

    background:#fff;
    border-radius:24px;
    box-shadow:0 16px 36px rgba(15,23,42,.12)
}
h1{margin:0 0 8px;font-size:2rem}

    margin:0 0 24px;
    padding:12px 16px;
    border:1px solid #cbd5e1;
    border-radius:14px;
    background:#f8fafc;
    color:#475569
}

    display:flex;
    flex-direction:column;
    gap:16px
}

    padding:20px;
    border:1px solid #e2e8f0;

}

    overflow-wrap:anywhere;
    color:#0f172a;
    font-size:1rem;
    font-weight:400;
    line-height:1.68
}

    margin-bottom:.45rem;

}

    display:block;

}

function downloadHtmlBackup(){
    if(
        !publicLoaded
        &&!state.length
    ){
        return;
    }

    try{
        const exportedAt=
            new Date()
                .toISOString();

        const exportedAtUnix=
            exportUnixTimestamp();

        const payload={
            backupFormat:
                BACKUP_FORMAT,

            schemaVersion:5,

            exportedAt,

            exportedAtUnix,

            entries:
                normalizeState(state)
        };

        const html=
            buildBackupHtml(
                payload
            );

        const blob=
            new Blob(
                [html],
                {
                    type:
                        'text/html;charset=utf-8'
                }
            );

        const url=
            URL.createObjectURL(
                blob
            );

        const a=
            document.createElement(
                'a'
            );

        a.href=url;

        a.download=
            `${EXPORT_SITE_NAME}${exportedAtUnix}.html`;

        document.body
            .appendChild(a);

        a.click();
        a.remove();

        setTimeout(
            ()=>URL.revokeObjectURL(url),
            0
        );
    }catch(error){
        console.error(error);

        show(
            `导出失败：${error.message}`,
            'error'
        );
    }
}

function parseImportedBackup(raw,file){
    const text=
        String(raw??'')
            .replace(/^\uFEFF/,'')
            .trim();

    if(!text){
        throw new Error(
            '文件为空'
        );
    }

    const htmlLike=
        /\.html?$/i.test(
            file?.name||''
        )
        ||/text\/html/i.test(
            file?.type||''
        )
        ||/^<!doctype\s+html/i.test(
            text
        )
        ||/<html[\s>]/i.test(
            text.slice(
                0,
                1000
            )
        );

    if(!htmlLike){
        return normalizeState(
            JSON.parse(text)
        );
    }

    const doc=
        new DOMParser()
            .parseFromString(
                text,
                'text/html'
            );

    const dataNode=
        doc.getElementById(
            BACKUP_DATA_ID
        )
        ||doc.querySelector(
            'script[data-memo-backup="true"][type="application/json"]'
        );

    if(!dataNode){
        throw new Error(
            '该 HTML 中未找到 Memo 恢复数据'
        );
    }

    const payload=
        JSON.parse(
            dataNode.textContent||''
        );

    if(
        payload?.backupFormat
        &&payload.backupFormat
            !==BACKUP_FORMAT
    ){
        throw new Error(
            '不支持的 Memo HTML 备份格式'
        );
    }

    if(
        !Array.isArray(payload)
        &&!Array.isArray(
            payload?.entries
        )
    ){
        throw new Error(
            'Memo 恢复数据格式无效'
        );
    }

    return normalizeState(payload);
}

function importFile(file){
    if(
        !unlocked
        ||!file
    ){
        return;
    }

    if(file.size>MAX_IMPORT_BYTES){
        show(
            '导入文件超过 4 MB',
            'error'
        );

        return;
    }

    const reader=
        new FileReader();

    reader.onload=e=>{
        try{
            const incoming=
                parseImportedBackup(
                    e.target.result,
                    file
                );

            if(
                !confirm(
                    '导入会替换当前 Memo 数据，确定继续吗？'
                )
            ){
                return;
            }

            state=incoming;

            markLocalChange();

            show(
                '导入成功',
                'success'
            );
        }catch(error){
            console.error(error);

            show(
                `导入失败：${error.message}`,
                'error'
            );
        }
    };

    reader.onerror=()=>{
        show(
            '导入失败：无法读取文件',
            'error'
        );
    };

    reader.readAsText(
        file,
        'utf-8'
    );
}

function openConfig(){
    cfgOwner.value=
        config.owner;

    cfgRepo.value=
        config.repo;

    cfgFile.value=
        config.file
        ||'memo_data.json';

    cfgToken.value=
        config.token;

    rememberToken.checked=
        Boolean(
            appGet(TOKEN_KEY)
        );

    updateVisibleViewportHeight();

    configModal.classList.remove(
        'hidden'
    );

    const scrollBody=
        configForm.querySelector(
            '.dialog-scroll'
        );

    if(scrollBody){
        scrollBody.scrollTop=0;
    }
}

async function submitConfig(event){
    event.preventDefault();

    const owner=
        clean(
            cfgOwner.value
        );

    const repo=
        clean(
            cfgRepo.value
        );

    const file=
        clean(
            cfgFile.value
        )
        ||'memo_data.json';

    const token=
        clean(
            cfgToken.value
        );

    if(
        !owner
        ||!repo
        ||!token
    ){
        show(
            '请完整填写仓库和 Token',
            'error'
        );

        return;
    }

    const oldTarget=
        target();

    config={
        owner,
        repo,
        file,
        token
    };

    try{
        await saveConfig();
    }catch(error){
        show(
            `配置保存失败：${formatError(error)}`,
            'error'
        );

        return;
    }

    if(
        oldTarget
        &&oldTarget!==target()
    ){
        meta={
            target:'',
            fingerprint:null,
            sha:null,
            lastSyncAt:null
        };

        await saveMeta();
    }

    configModal.classList.add(
        'hidden'
    );

    await login(true);
}

function updateBackToTopVisibility(){
    backToTopBtn.classList.toggle(
        'visible',
        window.scrollY>240
    );
}

function fastScrollToTop(){
    const startY=
        window.scrollY;

    if(startY<=0){
        return;
    }

    const duration=10;

    const startTime=
        performance.now();

    function step(now){
        const progress=
            Math.min(
                (now-startTime)
                /duration,
                1
            );

        const eased=
            1-Math.pow(
                1-progress,
                3
            );

        window.scrollTo(
            0,
            Math.round(
                startY
                *(1-eased)
            )
        );

        if(progress<1){
            requestAnimationFrame(
                step
            );
        }
    }

    requestAnimationFrame(
        step
    );
}

backToTopBtn.addEventListener(
    'click',
    fastScrollToTop
);

window.addEventListener(
    'scroll',
    updateBackToTopVisibility,
    {passive:true}
);
