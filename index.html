<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="app-build" content="2026-09-27-memo-v13">
<meta name="memo-data-file" content="memo_data.json">
<title>Memo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    min-height:100vh;
    padding:2rem 1rem 4rem;
    background:#f5f7fa;
    color:#0f172a;
    font-family:"Times New Roman","Microsoft YaHei","PingFang SC",serif;
}
button,input,textarea{font:inherit}
[contenteditable="true"]{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.container{
    width:min(100%,1100px);
    margin:auto;
    padding:2rem 1.8rem;
    background:#fff;
    border-radius:32px;
    box-shadow:0 20px 40px -12px rgba(0,0,0,.15);
}
.page-title{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:12px;
    margin-bottom:1.45rem;
    padding-bottom:.8rem;
    border-bottom:2px solid #e8edf4;
    color:#1e293b;
    font-size:2.2rem;
    font-weight:600;
    letter-spacing:-.5px;
}
.cloud-status{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:.35rem .9rem;
    border-radius:999px;
    background:#f1f5f9;
    color:#475569;
    font-size:.82rem;
    font-weight:500;
}
.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#94a3b8;
}
.status-dot.online{background:#22c55e}
.status-dot.offline{background:#ef4444}
.status-dot.syncing{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.control-bar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:1.7rem;
    padding-bottom:1rem;
    border-bottom:1px solid #e8edf4;
}
.control-group{display:flex;flex-wrap:wrap;gap:9px}
.btn{
    min-height:36px;
    padding:.45rem 1.1rem;
    border:1px solid #cbd5e1;
    border-radius:999px;
    background:#fff;
    color:#334155;
    font-size:.86rem;
    font-weight:650;
    transition:.15s;
}
.btn:hover{background:#f1f5f9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{border-color:#1e293b;background:#1e293b;color:#fff}
.btn-primary:hover{background:#0f172a}
.btn-sync{border-color:#1E40AF;background:#1E40AF;color:#fff}
.btn-sync:hover{border-color:#1E3A8A;background:#1E3A8A}
.btn-danger{border-color:#fecaca;background:#fee2e2;color:#991b1b}
.btn-danger:hover{background:#fecaca}
.last-sync{color:#94a3b8;font-size:.8rem}

.visitor-note{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    margin:-.55rem 0 .75rem;
    color:#94a3b8;
    font-size:.76rem;
}
.visitor-login-link{
    padding:0;
    border:0;
    background:transparent;
    color:#94a3b8;
    font-size:.76rem;
    text-decoration:underline;
    text-underline-offset:2px;
}
.visitor-login-link:hover{color:#64748b}

.add-section{
    margin-bottom:2rem;
    padding:1.5rem;
    border:1px solid #e2e8f0;
    border-radius:24px;
    background:#f8fafc;
}
.add-section h2{margin-bottom:1rem;font-size:1.3rem}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{
    color:#475569;
    font-size:.78rem;
    font-weight:700;
    letter-spacing:.04em;
}
.title-input{
    display:block;
    width:100%;
    min-height:44px;
    padding:.72rem 1rem;
    border:1px solid #cbd5e1;
    border-radius:15px;
    background:#fff;
    color:#0f172a;
    outline:none;
}
.title-input:focus{
    outline:2px solid #93b4ff;
    outline-offset:1px;
    border-color:transparent;
}
.title-input[readonly]{background:#f8fafc;color:#64748b}

.rich-editor-wrap{
    position:relative;
    overflow:hidden;
    border:1px solid #cbd5e1;
    border-radius:16px;
    background:#fff;
}
.rich-editor-wrap:focus-within{
    outline:2px solid #93b4ff;
    outline-offset:1px;
    border-color:transparent;
}
.rich-editor{
    width:100%;
    min-height:8.4rem;
    max-height:420px;
    overflow-y:scroll;
    overflow-x:hidden;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
    scrollbar-gutter:stable;
    scrollbar-width:thin;
    scrollbar-color:#94a3b8 #f1f5f9;
    padding:.9rem 1rem;
    color:#0f172a;
    outline:none;
    line-height:1.75;
    overflow-wrap:anywhere;
}
.rich-editor::-webkit-scrollbar{width:10px}
.rich-editor::-webkit-scrollbar-track{
    background:#f1f5f9;
    border-left:1px solid #e2e8f0;
}
.rich-editor::-webkit-scrollbar-thumb{
    min-height:42px;
    background:#94a3b8;
    border:2px solid #f1f5f9;
    border-radius:999px;
}
.rich-editor::-webkit-scrollbar-thumb:hover{background:#64748b}

.rich-editor-scrollbar{
    position:absolute;
    right:3px;
    z-index:6;
    display:block;
    width:7px;
    border-radius:999px;
    background:rgba(148,163,184,.28);
    opacity:0;
    pointer-events:none;
    touch-action:none;
    cursor:pointer;
    transition:opacity .15s ease;
}
.rich-editor-scrollbar.visible{
    opacity:.95;
    pointer-events:auto;
}
.rich-editor-scrollbar-thumb{
    position:absolute;
    inset:0 auto auto 0;
    width:100%;
    min-height:34px;
    border-radius:999px;
    background:#64748b;
    transform:translateY(0);
    cursor:grab;
    touch-action:none;
}
.rich-editor-scrollbar-thumb:active{cursor:grabbing}

.rich-editor p,
.rich-editor div,
.memo-content p,
.memo-content div{margin:.3em 0}

.rich-editor ul,
.rich-editor ol,
.memo-content ul,
.memo-content ol{
    padding-left:1.7em;
    margin:.45em 0;
}

.rich-editor blockquote,
.memo-content blockquote{
    margin:.55em 0;
    padding:.25em .8em;
    border-left:3px solid #cbd5e1;
    color:#475569;
}

.rich-editor hr,
.memo-content hr{
    margin:1em 0;
    border:0;
    border-top:1px solid #cbd5e1;
}

.first-line-indent{text-indent:2em}

.add-button{
    width:100%;
    min-height:46px;
    margin-top:1rem;
    border:0;
    border-radius:999px;
    background:#1e293b;
    color:#fff;
    font-weight:700;
}
.add-button:hover{background:#0f172a}

.list-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:10px;
    margin:1.8rem 0 .8rem;
}
.list-header h2{
    color:#0f172a;
    font-size:1.5rem;
    font-weight:600;
}
.count-badge{
    padding:.2rem 1rem;
    border-radius:40px;
    background:#e9edf4;
    color:#334155;
    text-align:center;
    font-size:.9rem;
    font-weight:500;
}

.memo-list{
    display:flex;
    flex-direction:column;
    gap:1.25rem;
    overflow:visible;
    margin-top:.5rem;
    border:0;
    border-radius:0;
    background:transparent;
}
.memo-item{
    position:relative;
    width:100%;
    min-width:0;
    padding:1.35rem 1.4rem 1.5rem;
    border:1px solid #e2e8f0;
    border-radius:20px;
    background:#fff;
    overflow:visible;
    transition:background .15s;
}
.memo-item::after{
    content:"";
    display:block;
    clear:both;
}
.memo-item > *{max-width:100%}
.memo-item:hover{background:#fafcff}

.memo-content{
    clear:both;
    min-width:0;
    padding-right:3.1rem;
    overflow-wrap:anywhere;
    word-break:break-word;
    color:#0f172a;
    font-size:1rem;
    font-weight:400;
    line-height:1.68;
}

.rich-editor > :first-child,
.memo-content > :first-child{
    margin-bottom:.45rem;
    color:#1E40AF;
    font-size:1.05rem;
    font-weight:600;
    line-height:1.45;
}

.memo-content a{
    color:#1E40AF;
    text-decoration:none;
}
.memo-content a:hover,
.memo-content a:focus-visible{
    color:#1E3A8A;
    text-decoration:underline;
    outline:none;
}

.memo-content mjx-container[jax="CHTML"]{
    max-width:100%;
    vertical-align:middle;
}
.memo-content mjx-container[display="true"]{
    display:block!important;
    max-width:100%;
    margin:.8em 0!important;
    padding:0!important;
    overflow-x:auto;
    overflow-y:hidden;
    text-align:center;
}

/* 仅兼容旧数据中的历史图片，不再提供图片上传/插入入口。 */
.rich-editor img,
.memo-content img{
    display:block;
    max-width:100%;
    height:auto;
    margin:.75em auto;
    border-radius:10px;
}

.rich-editor table,
.memo-content table{
    width:100%;
    margin:.8em 0;
    border-collapse:collapse;
    table-layout:auto;
}
.rich-editor th,
.rich-editor td,
.memo-content th,
.memo-content td{
    min-width:3em;
    padding:.38em .55em;
    border:1px solid #cbd5e1;
    vertical-align:top;
}
.rich-editor th,
.memo-content th{
    background:#f8fafc;
    font-weight:700;
}

.memo-footer{
    display:flex;
    align-items:flex-end;
    justify-content:flex-end;
    gap:12px;
    width:100%;
    margin-top:.65rem;
}
.publish-date{
    color:#94a3b8;
    font-size:.8rem;
}
.memo-edit-top{
    position:absolute;
    top:1rem;
    right:1rem;
    z-index:2;
}
.inline-note{
    color:#64748b;
    font-size:.95rem;
}
.item-actions{
    flex:0 0 auto;
    display:flex;
    align-items:flex-end;
    justify-content:flex-end;
    gap:6px;
    margin-left:auto;
}
.action-btn{
    padding:.28rem .72rem;
    border:0;
    border-radius:999px;
    font-size:.82rem;
    font-weight:650;
}
.edit-btn{
    padding:0;
    border-radius:0;
    background:transparent;
    color:#64748b;
    font-weight:500;
    text-decoration:none;
}
.edit-btn:hover,
.edit-btn:focus-visible{
    background:transparent;
    color:#1e3a8a;
    text-decoration:none;
    outline:none;
}
.delete-btn{
    background:#fee2e2;
    color:#991b1b;
}
.delete-btn:hover{background:#fecaca}

.empty-state{
    padding:2.5rem 1rem;
    background:#fafcff;
    color:#94a3b8;
    text-align:center;
    font-size:1.05rem;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:max(12px,env(safe-area-inset-top))
            max(12px,env(safe-area-inset-right))
            max(12px,env(safe-area-inset-bottom))
            max(12px,env(safe-area-inset-left));
    background:rgba(15,23,42,.45);
    backdrop-filter:blur(5px);
}
.dialog{
    position:relative;
    width:min(100%,620px);
    max-height:calc(
        var(--memo-visible-height,100dvh)
        - 24px
        - env(safe-area-inset-top)
        - env(safe-area-inset-bottom)
    );
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:#fff;
    border-radius:26px;
    box-shadow:0 30px 70px rgba(15,23,42,.28);
}
.dialog-scroll{
    flex:1 1 auto;
    min-height:0;
    overflow-y:scroll;
    overflow-x:hidden;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    scrollbar-gutter:stable;
    scrollbar-width:thin;
    scrollbar-color:#94a3b8 #f1f5f9;
    padding:1.7rem 1.7rem 1rem;
}
.dialog-scroll::-webkit-scrollbar{width:10px}
.dialog-scroll::-webkit-scrollbar-track{
    background:#f1f5f9;
    border-left:1px solid #e2e8f0;
}
.dialog-scroll::-webkit-scrollbar-thumb{
    min-height:42px;
    background:#94a3b8;
    border:2px solid #f1f5f9;
    border-radius:999px;
}
.dialog-scroll::-webkit-scrollbar-thumb:hover{background:#64748b}

.dialog h3{
    margin-bottom:.4rem;
    font-size:1.3rem;
}
.dialog-desc{
    margin-bottom:1rem;
    padding-bottom:.8rem;
    border-bottom:1px solid #e2e8f0;
    color:#64748b;
    font-size:.86rem;
    line-height:1.6;
}
.dialog .form-group{margin-bottom:.95rem}
.dialog input{
    width:100%;
    min-height:44px;
    padding:.72rem 1rem;
    border:1px solid #cbd5e1;
    border-radius:15px;
    background:#fff;
    color:#0f172a;
    outline:none;
}
.dialog input:focus{
    outline:2px solid #93b4ff;
    outline-offset:1px;
    border-color:transparent;
}
.dialog-actions{
    display:flex;
    justify-content:flex-end;
    gap:9px;
    padding:.95rem 1.7rem max(.95rem,env(safe-area-inset-bottom));
    border-top:1px solid #e8edf4;
    background:#fff;
}

#editModal .dialog-actions{
    justify-content:flex-end;
}
#editModal #editDelete{
    margin-right:auto;
}
#editModal .dialog-actions .btn{
    flex:0 0 auto;
}

#configModal{
    overflow:hidden;
}
#configForm{
    height:min(
        720px,
        calc(
            var(--memo-visible-height,100dvh)
            - 24px
            - env(safe-area-inset-top)
            - env(safe-area-inset-bottom)
        )
    );
    max-height:calc(
        var(--memo-visible-height,100dvh)
        - 24px
        - env(safe-area-inset-top)
        - env(safe-area-inset-bottom)
    );
}
#configForm .dialog-scroll{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    scrollbar-gutter:stable;
}
#configForm .dialog-scroll::-webkit-scrollbar{width:10px}
#configForm .dialog-scroll::-webkit-scrollbar-track{
    background:#f1f5f9;
    border-radius:999px;
}
#configForm .dialog-scroll::-webkit-scrollbar-thumb{
    background:#cbd5e1;
    border:2px solid #f1f5f9;
    border-radius:999px;
}
#configForm .dialog-actions{
    flex:0 0 auto;
    position:relative;
    z-index:2;
    margin-top:0;
    box-shadow:0 -8px 20px rgba(15,23,42,.06);
}

.remember-row{
    display:flex;
    align-items:flex-start;
    gap:8px;
    color:#334155;
    font-size:.82rem;
    line-height:1.5;
}
.remember-row input{
    width:auto;
    min-height:auto;
    margin-top:.2rem;
    accent-color:#1E40AF;
}

.toast{
    position:fixed;
    left:50%;
    bottom:28px;
    z-index:1500;
    max-width:min(90vw,680px);
    padding:.78rem 1.5rem;
    transform:translateX(-50%);
    border-radius:999px;
    background:#1E40AF;
    color:#fff;
    font-size:.88rem;
    font-weight:600;
    text-align:center;
    box-shadow:0 12px 34px rgba(15,23,42,.25);
}
.toast.success{background:#16a34a}
.toast.error{background:#dc2626}
.toast.info{background:#1E40AF}

.back-to-top{
    position:fixed;
    right:18px;
    top:70%;
    width:30px;
    height:30px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transform:translateY(-50%);
    z-index:900;
    border:0;
    border-radius:50%;
    background:#1E40AF;
    color:#1E40AF;
    font-family:inherit;
    font-size:0;
    line-height:1;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(37,99,235,.28);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:
        opacity .2s ease,
        visibility .2s ease,
        background .2s ease,
        color .2s ease,
        border-color .2s ease,
        transform .2s ease;
}
.back-to-top.visible{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}
.back-to-top:hover,
.back-to-top:focus-visible{
    opacity:1;
    color:#1E3A8A;
    background:#1E3A8A;
    transform:translateY(-50%) translateX(-2px);
    outline:none;
}

@media(max-width:700px){
    body{padding:.8rem}
    .container{padding:1.25rem;border-radius:22px}
    .page-title{font-size:1.8rem}
    .control-bar{
        flex-direction:column;
        align-items:stretch;
    }
    .control-group{justify-content:center}
    .last-sync{text-align:center}
    .add-section{padding:1.2rem}
    .rich-editor{
        min-height:170px;
        height:clamp(170px,36dvh,300px);
        max-height:300px;
        overflow-y:scroll;
        padding-right:.8rem;
    }
    .rich-editor::-webkit-scrollbar{width:8px}
    .rich-editor::-webkit-scrollbar-thumb{min-height:48px}
    .rich-editor-scrollbar{
        right:3px;
        width:6px;
    }
    .memo-item{padding:1.05rem 1rem 1.2rem}
    .memo-content{font-size:1rem}
    .dialog{
        width:100%;
        border-radius:20px;
    }
    .dialog-scroll{padding:1.2rem 1.2rem .8rem}
    .dialog-actions{
        padding:.85rem 1.2rem max(.85rem,env(safe-area-inset-bottom));
    }
    #editModal{
        align-items:stretch;
        overflow:hidden;
        padding:
            max(8px,env(safe-area-inset-top))
            max(8px,env(safe-area-inset-right))
            max(8px,env(safe-area-inset-bottom))
            max(8px,env(safe-area-inset-left));
    }
    #editModal .dialog{
        width:100%;
        height:calc(
            var(--memo-visible-height,100dvh)
            - 16px
            - env(safe-area-inset-top)
            - env(safe-area-inset-bottom)
        );
        max-height:calc(
            var(--memo-visible-height,100dvh)
            - 16px
            - env(safe-area-inset-top)
            - env(safe-area-inset-bottom)
        );
        margin:auto 0;
    }
    #editModal .dialog-scroll{
        flex:1 1 auto;
        min-height:0;
        overflow-y:scroll;
    }
    .dialog-actions .btn{flex:1}
    #configModal{
        align-items:stretch;
        padding:
            max(8px,env(safe-area-inset-top))
            max(8px,env(safe-area-inset-right))
            max(8px,env(safe-area-inset-bottom))
            max(8px,env(safe-area-inset-left));
    }
    #configForm{
        width:100%;
        height:calc(
            var(--memo-visible-height,100dvh)
            - 16px
            - env(safe-area-inset-top)
            - env(safe-area-inset-bottom)
        );
        max-height:calc(
            var(--memo-visible-height,100dvh)
            - 16px
            - env(safe-area-inset-top)
            - env(safe-area-inset-bottom)
        );
        border-radius:20px;
    }
    #configForm .dialog-scroll{
        padding:1.2rem 1.2rem .8rem;
    }
    #configForm .dialog-actions{
        padding:.85rem 1.2rem max(.85rem,env(safe-area-inset-bottom));
    }
    .back-to-top{
        right:8px;
        top:70%;
        width:29px;
        height:29px;
        padding:0;
        font-size:.68rem;
    }
}
</style>
</head>

<body>
<main class="container">
    <h1 class="page-title">
        Memo
        <span class="cloud-status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">公开浏览</span>
        </span>
    </h1>

    <section class="control-bar">
        <div class="control-group">
            <button class="btn btn-sync" id="syncBtn" type="button" disabled>同步</button>
            <button class="btn" id="configBtn" type="button">编辑登录</button>
            <button class="btn" id="exportBtn" type="button" disabled>导出</button>
            <button class="btn" id="importBtn" type="button" disabled>导入</button>
            <input
                type="file"
                id="fileInput"
                accept=".html,text/html,.json,application/json"
                hidden
            >
        </div>
        <span class="last-sync" id="lastSyncTime">正在加载公开内容…</span>
    </section>

    <section class="visitor-note hidden" id="lockedPanel" aria-hidden="true">
        <span>公开浏览</span>
        <button class="visitor-login-link" id="lockedConfigBtn" type="button">
            编辑登录
        </button>
    </section>

    <div id="appContent">
        <section class="add-section hidden" id="editorSection">
            <h2>添加</h2>

            <div class="form-group" style="margin-bottom:.9rem">
                <label for="contentInput">正文</label>
                <div class="rich-editor-wrap">
                    <div
                        class="rich-editor"
                        id="contentInput"
                        contenteditable="true"
                        role="textbox"
                        aria-multiline="true"
                    ></div>
                </div>
            </div>

            <button class="add-button" id="addBtn" type="button">提交</button>
        </section>

        <section>
            <div class="list-header">
                <h2>总表</h2>
                <span class="count-badge" id="countDisplay">0</span>

    let p=(location.pathname||'/')

        .replace(/\/(?:index\.html?)$/i,'/');

    if(p.length>1&&p.endsWith('/')){

    return `${location.origin}${p}`;
}

function hashIdentity(value){
    let hash=0x811c9dc5;

    for(let i=0;i<value.length;i++){
        hash^=value.charCodeAt(i);
        hash=Math.imul(hash,0x01000193);
    }

    return (hash>>>0).toString(16).padStart(8,'0');
}

function clean(v){

function esc(v){

    d.textContent=String(v??'');
    return d.innerHTML;

function attr(v){

function uid(){

        ? crypto.randomUUID()
        : `memo_${Date.now()}_${Math.random().toString(36).slice(2,10)}`;

function validIso(v){
    const s=clean(v);

const ALLOWED_TAGS=new Set([
    'B',
    'STRONG',
    'I',
    'EM',
    'U',
    'S',
    'STRIKE',
    'P',
    'DIV',
    'BR',
    'HR',
    'UL',
    'OL',
    'LI',
    'BLOCKQUOTE',
    'SPAN',
    'IMG',
    'TABLE',
    'THEAD',
    'TBODY',
    'TFOOT',
    'TR',
    'TH',
    'TD',
    'CAPTION'
]);

function normalizeHttpUrl(value){
    const url=String(value??'').trim();
    return /^https?:\/\/[^\s<>()]+$/i.test(url)?url:'';
}

/*
旧 Memo 数据中如果已经存在图片，保留兼容读取。
当前页面不再提供新增、选择或上传图片的功能。
*/
function normalizeImageSrc(value){
    const src=String(value??'').trim();

    if(!src||/[<>"']/u.test(src)){
        return '';
    }

    if(/^(?:javascript|data|file):/i.test(src)){
        return '';
    }

    if(/^\/\//.test(src)){
        return '';
    }

    if(/^blob:/i.test(src)||/^https?:\/\//i.test(src)){
        return src;
    }

    if(/^[a-z][a-z0-9+.-]*:/i.test(src)){
        return '';
    }

    return src;
}

function anchorToMarkdownText(anchor){
    const label=(anchor.textContent||'')
        .replace(/\u00a0/g,' ')
        .trim();

    const url=normalizeHttpUrl(anchor.getAttribute('href'));

    if(!url){
        return label;
    }

    if(
        /^\[[^\]\r\n]+\]\(https?:\/\/[^\s<>()]+\)$/i.test(label)
    ){
        return label;
    }

    return `[${label||url}](${url})`;
}

function replaceAnchorsWithMarkdown(root){
    [...root.querySelectorAll('a')].forEach(anchor=>{
        anchor.replaceWith(
            document.createTextNode(anchorToMarkdownText(anchor))
        );
    });
}

function sanitizeHtml(value){
    const template=document.createElement('template');

    template.innerHTML=String(value??'');

    replaceAnchorsWithMarkdown(template.content);

    const cleanNode=node=>{
        for(const child of [...node.childNodes]){
            if(child.nodeType===Node.COMMENT_NODE){
                child.remove();
                continue;
            }

            if(child.nodeType!==Node.ELEMENT_NODE){
                continue;
            }

            const tag=child.tagName.toUpperCase();

            if(
                tag==='SCRIPT'
                ||tag==='STYLE'
                ||tag==='IFRAME'
                ||tag==='OBJECT'
                ||tag==='EMBED'
                ||tag==='LINK'
                ||tag==='META'
            ){
                child.remove();
                continue;
            }

            cleanNode(child);

            if(!ALLOWED_TAGS.has(tag)){
                child.replaceWith(...child.childNodes);
                continue;
            }

            const keepIndent=
                (tag==='P'||tag==='DIV')
                &&child.classList.contains('first-line-indent');

            const keepInlineNote=
                tag==='SPAN'
                &&child.classList.contains('inline-note');

            const imageSrc=
                tag==='IMG'
                    ? normalizeImageSrc(child.getAttribute('src'))
                    : '';

            const imageAlt=
                tag==='IMG'
                    ? String(child.getAttribute('alt')||'').slice(0,300)
                    : '';

            for(const attribute of [...child.attributes]){
                child.removeAttribute(attribute.name);
            }

            if(keepIndent){
                child.className='first-line-indent';
            }

            if(keepInlineNote){
                child.className='inline-note';
            }

            if(tag==='IMG'){
                if(!imageSrc){
                    child.remove();
                    continue;
                }

                child.setAttribute('src',imageSrc);

                if(imageAlt){
                    child.setAttribute('alt',imageAlt);
                }
            }
        }
    };

    cleanNode(template.content);

    return template.innerHTML.trim();
}

function renderMarkdownLinks(value){
    const template=document.createElement('template');

    template.innerHTML=sanitizeHtml(value);

    const regex=/\[([^\]\r\n]+)\]\((https?:\/\/[^\s<>()]+)\)/gi;

    const walker=document.createTreeWalker(
        template.content,
        NodeFilter.SHOW_TEXT
    );

    const nodes=[];

    while(walker.nextNode()){
        nodes.push(walker.currentNode);
    }

    for(const node of nodes){
        const text=node.nodeValue||'';

        regex.lastIndex=0;

        if(!regex.test(text)){
            continue;
        }

        regex.lastIndex=0;

        const fragment=document.createDocumentFragment();

        let last=0;
        let match;

        while((match=regex.exec(text))){
            if(match.index>last){
                fragment.appendChild(
                    document.createTextNode(
                        text.slice(last,match.index)
                    )
                );
            }

            const link=document.createElement('a');

            link.href=match[2];
            link.target='_blank';
            link.rel='noopener noreferrer';
            link.textContent=match[1];

            fragment.appendChild(link);

            last=regex.lastIndex;
        }

        if(last<text.length){
            fragment.appendChild(
                document.createTextNode(text.slice(last))
            );
        }

        node.replaceWith(fragment);
    }

    return template.innerHTML;
}

function clipboardHtmlToMarkdownText(html,fallback=''){
    const template=document.createElement('template');

    template.innerHTML=String(html||'');

    const blockTags=new Set([
        'P',
        'DIV',
        'LI',
        'BLOCKQUOTE',
        'UL',
        'OL',
        'H1',
        'H2',
        'H3',
        'H4',
        'H5',
        'H6',
        'PRE'
    ]);

    const read=node=>{
        if(node.nodeType===Node.TEXT_NODE){
            return node.nodeValue||'';
        }

        if(
            node.nodeType!==Node.ELEMENT_NODE
            &&node.nodeType!==Node.DOCUMENT_FRAGMENT_NODE
        ){
            return '';
        }

        if(node.nodeType===Node.ELEMENT_NODE){
            const tag=node.tagName.toUpperCase();

            if(tag==='BR'){
                return '\n';
            }

            if(tag==='A'){
                return anchorToMarkdownText(node);
            }

            let inner=[...node.childNodes]
                .map(read)
                .join('');

            if(
                blockTags.has(tag)
                &&inner
                &&!inner.endsWith('\n')
            ){
                inner+='\n';
            }

            return inner;
        }

        return [...node.childNodes]
            .map(read)
            .join('');
    };

    const result=read(template.content)
        .replace(/\r\n?/g,'\n')
        .replace(/\n{3,}/g,'\n\n')
        .trim();

    return result||String(fallback||'');
}

function looksLikeLatexPlainText(text){
    const s=String(text||'');

    if(!s){
        return false;
    }

    if(/\$\$[\s\S]+?\$\$/.test(s)){
        return true;
    }

    if(/\$(?!\$)(?:\\.|[^$\r\n])+?\$/.test(s)){
        return true;
    }

    if(/\\\([\s\S]+?\\\)/.test(s)){
        return true;
    }

    if(/\\\[[\s\S]+?\\\]/.test(s)){
        return true;
    }

    return /\\(?:frac|dfrac|tfrac|sqrt|sum|prod|int|iint|iiint|oint|lim|log|ln|sin|cos|tan|arcsin|arccos|arctan|alpha|beta|gamma|delta|epsilon|varepsilon|theta|vartheta|lambda|mu|nu|xi|pi|rho|sigma|tau|phi|varphi|chi|psi|omega|Gamma|Delta|Theta|Lambda|Xi|Pi|Sigma|Phi|Psi|Omega|mathrm|mathbf|mathit|mathbb|mathcal|text|operatorname|begin|end|left|right|cdot|times|div|pm|mp|leq|geq|neq|approx|equiv|infty|partial|nabla|overline|underline|hat|widehat|bar|vec|dot|ddot|boxed)\b/.test(s);
}

function clipboardTextForEditor(plain,html){
    const rawPlain=String(plain??'');

    if(looksLikeLatexPlainText(rawPlain)){
        return rawPlain.replace(/\r\n?/g,'\n');
    }

    return html
        ? clipboardHtmlToMarkdownText(html,rawPlain)
        : rawPlain;
}

/* =========================
   MathJax
   ========================= */

const MATHJAX_SOURCES=[
    'https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js',
    'https://unpkg.com/mathjax@4/tex-chtml.js',
    'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.min.js'
];

let mathJaxLoadPromise=null;
let mathRenderVersion=0;

function ensureMathJax(){
    if(
        window.MathJax
        &&typeof window.MathJax.typesetPromise==='function'
    ){
        return Promise.resolve(window.MathJax);
    }

    if(mathJaxLoadPromise){
        return mathJaxLoadPromise;
    }

    const existing=
        window.MathJax
        &&typeof window.MathJax==='object'
            ? window.MathJax
            : {};

    window.MathJax={
        ...existing,

        tex:{
            ...(existing.tex||{}),

            inlineMath:[
                ['$','$'],
                ['\\(','\\)']
            ],

            displayMath:[
                ['$$','$$'],
                ['\\[','\\]']
            ],

            processEscapes:true
        },

        startup:{
            ...(existing.startup||{}),
            typeset:false
        }
    };

    mathJaxLoadPromise=new Promise((resolve,reject)=>{
        let index=0;

        const tryNext=()=>{
            if(index>=MATHJAX_SOURCES.length){
                reject(
                    new Error('数学公式渲染器加载失败')
                );
                return;
            }

            const script=document.createElement('script');

            script.src=MATHJAX_SOURCES[index++];
            script.defer=true;
            script.crossOrigin='anonymous';

            script.onload=()=>{
                if(
                    window.MathJax
                    &&typeof window.MathJax.typesetPromise==='function'
                ){
                    resolve(window.MathJax);
                }else{
                    script.remove();
                    tryNext();
                }
            };

            script.onerror=()=>{
                script.remove();
                tryNext();
            };

            document.head.appendChild(script);
        };

        tryNext();
    });

    return mathJaxLoadPromise;
}

function clearTypesetMath(container){
    if(
        window.MathJax
        &&typeof window.MathJax.typesetClear==='function'
    ){
        try{
            window.MathJax.typesetClear([container]);
        }catch(error){
            console.warn(
                '清理公式渲染状态失败',
                error
            );
        }
    }
}

function queueMathTypeset(container,version){
    const rawHtml=container.innerHTML;

    ensureMathJax()
        .then(async mathJax=>{
            if(
                version!==mathRenderVersion
                ||!container.isConnected
            ){
                return;
            }

            const ready=
                mathJax.startup
                &&mathJax.startup.promise
                    ? mathJax.startup.promise
                    : Promise.resolve();

            try{
                await ready;
                await mathJax.typesetPromise([container]);
            }catch(error){
                console.error(
                    '数学公式渲染失败',
                    error
                );

                if(
                    version===mathRenderVersion
                    &&container.isConnected
                ){
                    container.innerHTML=rawHtml;
                }
            }
        })
        .catch(error=>{
            console.error(error);

            if(
                version===mathRenderVersion
                &&container.isConnected
            ){
                container.innerHTML=rawHtml;
            }
        });
}

/* =========================
   Memo 数据规范化
   ========================= */

function plainTextToHtml(value){
    const text=String(value??'')
        .replace(/\r\n?/g,'\n')
        .trim();

    return text
        ? esc(text).replace(/\n/g,'<br>')
        : '';
}

function htmlToText(value){
    const div=document.createElement('div');

    div.innerHTML=sanitizeHtml(value);

    return (div.textContent||'')
        .replace(/\u00a0/g,' ')
        .trim();
}

function hasMeaningfulContent(value){
    const html=sanitizeHtml(value);

    if(htmlToText(html)){
        return true;
    }

    const div=document.createElement('div');

    div.innerHTML=html;

    return Boolean(
        div.querySelector('img,table')
    );
}

function getEditorHtml(editor){
    normalizeEditorParagraphModelPreservingSelection(editor);
    return sanitizeHtml(editor.innerHTML);
}

function setEditorHtml(editor,value){
    editor.innerHTML=sanitizeHtml(value);
    normalizeEditorParagraphModel(editor);
}

function normalizeAttachmentFolder(value){
    const raw=String(value??'').trim();

    if(!/^\d{10}$/.test(raw)){
        return null;
    }

    const timestamp=Number(raw);

    return Number.isSafeInteger(timestamp)
        &&timestamp>=UNIX_FOLDER_MIN
        &&timestamp<=UNIX_FOLDER_MAX
            ? timestamp
            : null;
}

function mergeLegacyTitleIntoContent(title,content){
    const legacyTitle=String(title??'').trim();
    const body=sanitizeHtml(content);

    if(!legacyTitle){
        return body;
    }

    const titleBlock=
        `<div>${esc(legacyTitle).replace(/\r?\n/g,'<br>')}</div>`;

    return sanitizeHtml(
        `${titleBlock}${body}`
    );
}

function normalizeEntry(x){
    if(!x||typeof x!=='object'){
        return null;
    }

    const id=clean(x.id)||uid();

    const source=String(x.source??'').trim();

    const raw=String(x.content??'').trim();

    const baseContent=
        x.contentFormat==='html'
            ? sanitizeHtml(raw)
            : plainTextToHtml(raw);

    const content=
        mergeLegacyTitleIntoContent(
            x.title,
            baseContent
        );

    const createdAt=validIso(x.createdAt);

    if(
        !hasMeaningfulContent(content)
        ||!createdAt
    ){
        return null;
    }

    return{
        id,
        attachmentFolder:normalizeAttachmentFolder(x.attachmentFolder),
        title:'',
        source,
        content,
        contentFormat:'html',
        createdAt
    };
}

/*
排序唯一依据：
1. 发布时间 createdAt 倒序。
2. 时间完全相同时才使用内部 ID 保证排序稳定。
编辑正文不会修改 createdAt。
*/
function compareMemo(a,b){
    const byPublishedTime=
        Date.parse(b.createdAt)
        -Date.parse(a.createdAt);

    if(byPublishedTime!==0){
        return byPublishedTime;
    }

    return String(b.id).localeCompare(
        String(a.id)
    );
}

function normalizeState(value){
    const source=
        Array.isArray(value)
            ? value
            : (
                value
                &&Array.isArray(value.entries)
                    ? value.entries
                    : []
            );

    const entries=source
        .map(normalizeEntry)
        .filter(Boolean)
        .sort(compareMemo);

    const used=new Set();

    for(const item of entries){
        const folder=
            normalizeAttachmentFolder(
                item.attachmentFolder
            );

        if(
            folder!==null
            &&!used.has(folder)
        ){
            item.attachmentFolder=folder;
            used.add(folder);
        }else{
            item.attachmentFolder=null;
        }
    }

    return entries;
}

function fingerprint(value=state){
    return JSON.stringify(
        normalizeState(value)
    );
}

function formatDate(iso){
    const d=new Date(iso);

    if(Number.isNaN(d.getTime())){
        return '';
    }

    const y=d.getFullYear();

    const m=String(
        d.getMonth()+1
    ).padStart(2,'0');

    const day=String(
        d.getDate()
    ).padStart(2,'0');

    return `${y}-${m}-${day}`;
}

function target(){
    return config.owner
        &&config.repo
        &&config.file
            ? `${config.owner}/${config.repo}/${config.file}`
            : '';
}

function adminConfigured(){

function pathEncode(path){
    return String(path)
        .split('/')
        .filter(Boolean)
        .map(encodeURIComponent)
        .join('/');
}

/* =========================
   主 IndexedDB / OPFS
   ========================= */

function openAppDb(){
    if(appDbPromise){
        return appDbPromise;
    }

    appDbPromise=new Promise((resolve,reject)=>{
        if(!('indexedDB' in window)){
            reject(
                new Error('IndexedDB unavailable')
            );
            return;
        }

        const request=
            indexedDB.open(
                APP_DB_NAME,
                APP_DB_VERSION
            );

        request.onupgradeneeded=()=>{
            const db=request.result;

            if(!db.objectStoreNames.contains(APP_STORE)){
                db.createObjectStore(
                    APP_STORE,
                    {keyPath:'key'}
                );
            }
        };

        request.onsuccess=()=>{
            resolve(request.result);
        };

        request.onerror=()=>{
            reject(
                request.error
                ||new Error('IndexedDB open failed')
            );
        };
    });

    return appDbPromise;
}

async function enqueueAppPut(key,value){
    appWriteChain=
        appWriteChain
            .catch(()=>{})
            .then(async()=>{
                const db=await openAppDb();

                await new Promise((resolve,reject)=>{
                    const tx=
                        db.transaction(
                            APP_STORE,
                            'readwrite'
                        );

                    tx.objectStore(APP_STORE)
                        .put({
                            key:String(key),
                            value:String(value)
                        });

                    tx.oncomplete=()=>resolve();

                    tx.onerror=()=>{
                        reject(
                            tx.error
                            ||new Error(
                                'IndexedDB write failed'
                            )
                        );
                    };

                    tx.onabort=()=>{
                        reject(
                            tx.error
                            ||new Error(
                                'IndexedDB write aborted'
                            )
                        );
                    };
                });
            });

    return appWriteChain;
}

async function enqueueAppDelete(key){
    appWriteChain=
        appWriteChain
            .catch(()=>{})
            .then(async()=>{
                const db=await openAppDb();

                await new Promise((resolve,reject)=>{
                    const tx=
                        db.transaction(
                            APP_STORE,
                            'readwrite'
                        );

                    tx.objectStore(APP_STORE)
                        .delete(String(key));

                    tx.oncomplete=()=>resolve();

                    tx.onerror=()=>{
                        reject(
                            tx.error
                            ||new Error(
                                'IndexedDB delete failed'
                            )
                        );
                    };

                    tx.onabort=()=>{
                        reject(
                            tx.error
                            ||new Error(
                                'IndexedDB delete aborted'
                            )
                        );
                    };
                });
            });

    return appWriteChain;
}

function appGet(key){
    const k=String(key);

    return appCache.has(k)
        ? appCache.get(k)
        : null;
}

function appSet(key,value){
    const k=String(key);
    const v=String(value);

    appCache.set(k,v);

    return enqueueAppPut(k,v);
}

function appDelete(key){
    const k=String(key);

    appCache.delete(k);

    return enqueueAppDelete(k);
}

async function readWorkingCopyOpfs(){
    if(!navigator.storage?.getDirectory){
        return null;
    }

    try{
        const root=
            await navigator.storage.getDirectory();

        const handle=
            await root.getFileHandle(
                WORK_OPFS_FILE
            );

        const file=
            await handle.getFile();

        const record=
            JSON.parse(
                await file.text()
            );

        return record
            &&typeof record==='object'
            &&typeof record.cacheJson==='string'
                ? record
                : null;
    }catch(error){
        return null;
    }
}

function queueWorkingCopyOpfsWrite(snapshot=state){
    const normalized=
        normalizeState(snapshot);

    const record={
        savedAt:Date.now(),
        fingerprint:fingerprint(normalized),
        cacheJson:JSON.stringify(normalized)
    };

    workingCopyOpfsRecord=record;

    workingCopyOpfsWriteChain=
        workingCopyOpfsWriteChain
            .catch(()=>{})
            .then(async()=>{
                if(!navigator.storage?.getDirectory){
                    return false;
                }

                const root=
                    await navigator.storage.getDirectory();

                const handle=
                    await root.getFileHandle(
                        WORK_OPFS_FILE,
                        {create:true}
                    );

                const writable=
                    await handle.createWritable();

                await writable.write(
                    JSON.stringify(record)
                );

                await writable.close();

                return true;
            })
            .catch(error=>{
                console.warn(
                    'OPFS 工作副本写入失败',
                    error
                );

                return false;
            });

    return workingCopyOpfsWriteChain;
}

async function initAppStorage(){
    const db=await openAppDb();

    await new Promise((resolve,reject)=>{
        const tx=
            db.transaction(
                APP_STORE,
                'readonly'
            );

        const request=
            tx.objectStore(APP_STORE)
                .getAll();

        request.onsuccess=()=>{
            appCache.clear();

            for(const row of request.result||[]){
                appCache.set(
                    String(row.key),
                    String(row.value??'')
                );
            }

            resolve();
        };

        request.onerror=()=>{
            reject(
                request.error
                ||new Error(
                    'IndexedDB read failed'
                )
            );
        };
    });

    try{
        if(navigator.storage?.persist){
            await navigator.storage.persist();
        }
    }catch(error){}

    workingCopyOpfsRecord=
        await readWorkingCopyOpfs();

    if(
        appGet(WORK_CACHE_KEY)===null
        &&workingCopyOpfsRecord?.cacheJson
    ){
        appCache.set(
            WORK_CACHE_KEY,
            String(
                workingCopyOpfsRecord.cacheJson
            )
        );

        await enqueueAppPut(
            WORK_CACHE_KEY,
            String(
                workingCopyOpfsRecord.cacheJson
            )
        );
    }
}

async function persistWorkingCopyNow(snapshot=state){
    const normalized=
        normalizeState(snapshot);

    const json=
        JSON.stringify(normalized);

    appCache.set(
        WORK_CACHE_KEY,
        json
    );

    const idbPromise=
        enqueueAppPut(
            WORK_CACHE_KEY,
            json
        );

    const opfsPromise=
        queueWorkingCopyOpfsWrite(
            normalized
        );

    const results=
        await Promise.allSettled([
            idbPromise,
            opfsPromise
        ]);

    if(results[0].status==='rejected'){
        throw results[0].reason
            ||new Error(
                'IndexedDB 工作副本写入失败'
            );
    }

    return normalized;
}

function saveWorkingCache(){
    const normalized=
        normalizeState(state);

    const json=
        JSON.stringify(normalized);

    appCache.set(
        WORK_CACHE_KEY,

        WORK_CACHE_KEY,
        json
    ).catch(error=>{
        console.error(
            'IndexedDB 工作副本写入失败',
            error
        );
    });

    queueWorkingCopyOpfsWrite(
        normalized
    );

    return true;
}

function formatError(error){
    if(!error){
        return '未知错误';
    }

    if(error.status===401){
        return 'Token 无效或已过期';
    }

    if(error.status===403){
        return 'Token 权限不足或仓库访问被拒绝';
    }

    if(error.status===404){
        return '仓库或数据文件不存在，或 Token 无权访问';
    }

    if(error.status===409){
        return '云端文件已被其他设备修改';
    }

    return error.message||String(error);
}

/* =========================
   草稿：IndexedDB + OPFS
   ========================= */

function draftRecordValid(record){
    return !!record
        &&typeof record==='object'
        &&['draft','tombstone'].includes(record.kind)
        &&Number(record.savedAt)>0;
}

function openDraftDb(){
    return new Promise((resolve,reject)=>{
        if(!('indexedDB' in window)){
            reject(
                new Error('IndexedDB unavailable')
            );
            return;
        }

        const request=
            indexedDB.open(
                DRAFT_DB_NAME,
                DRAFT_DB_VERSION
            );

        request.onupgradeneeded=()=>{
            const db=request.result;

            if(!db.objectStoreNames.contains(DRAFT_STORE)){
                db.createObjectStore(
                    DRAFT_STORE,
                    {keyPath:'key'}
                );
            }
        };

        request.onsuccess=()=>{
            resolve(request.result);
        };

        request.onerror=()=>{
            reject(
                request.error
                ||new Error(
                    'IndexedDB open failed'
                )
            );
        };
    });
}

async function draftDbRead(key){
    const db=await openDraftDb();

    try{
        return await new Promise((resolve,reject)=>{
            const tx=
                db.transaction(
                    DRAFT_STORE,
                    'readonly'
                );

            const req=
                tx.objectStore(DRAFT_STORE)
                    .get(key);

            req.onsuccess=()=>{
                resolve(
                    req.result?.record
                    ||null
                );
            };

            req.onerror=()=>{
                reject(
                    req.error
                    ||new Error(
                        'IndexedDB read failed'
                    )
                );
            };
        });
    }finally{
        db.close();
    }
}

async function draftDbWrite(key,record){
    const db=await openDraftDb();

    try{
        await new Promise((resolve,reject)=>{
            const tx=
                db.transaction(
                    DRAFT_STORE,
                    'readwrite'
                );

            tx.objectStore(DRAFT_STORE)
                .put({
                    key,
                    record
                });

            tx.oncomplete=()=>resolve();

            tx.onerror=()=>{
                reject(
                    tx.error
                    ||new Error(
                        'IndexedDB write failed'
                    )
                );
            };

            tx.onabort=()=>{
                reject(
                    tx.error
                    ||new Error(
                        'IndexedDB write aborted'
                    )
                );
            };
        });
    }finally{
        db.close();
    }
}

async function draftOpfsRead(fileName){
    if(!navigator.storage?.getDirectory){
        return null;
    }

    try{
        const root=
            await navigator.storage.getDirectory();

        const handle=
            await root.getFileHandle(
                fileName
            );

        const file=
            await handle.getFile();

        const record=
            JSON.parse(
                await file.text()
            );

        return draftRecordValid(record)
            ? record
            : null;
    }catch(error){
        return null;
    }
}

async function draftOpfsWrite(fileName,record){
    if(!navigator.storage?.getDirectory){
        return false;
    }

    try{
        const root=
            await navigator.storage.getDirectory();

        const handle=
            await root.getFileHandle(
                fileName,
                {create:true}
            );

        const writable=
            await handle.createWritable();

        await writable.write(
            JSON.stringify(record)
        );

        await writable.close();

        return true;
    }catch(error){
        console.warn(
            'OPFS 草稿写入失败',
            error
        );

        return false;
    }
}

async function requestPersistentDraftStorage(){
    try{
        if(navigator.storage?.persist){
            await navigator.storage.persist();
        }
    }catch(error){}
}

async function readBestDraftRecord(key,fileName){
    let dbRecord=null;
    let opfsRecord=null;

    try{
        dbRecord=
            await draftDbRead(key);
    }catch(error){
        console.warn(
            'IndexedDB 草稿读取失败',
            error
        );
    }

    opfsRecord=
        await draftOpfsRead(fileName);

    const records=[
        dbRecord,
        opfsRecord
    ]
        .filter(draftRecordValid)
        .sort(
            (a,b)=>
                Number(b.savedAt)
                -Number(a.savedAt)
        );

    return records[0]||null;
}

function enqueueDraftWrite(key,fileName,record){
    draftWriteChain=
        draftWriteChain
            .catch(()=>{})
            .then(async()=>{
                const results=
                    await Promise.allSettled([
                        draftDbWrite(
                            key,
                            record
                        ),
                        draftOpfsWrite(
                            fileName,
                            record
                        )
                    ]);

                const dbOk=
                    results[0].status==='fulfilled';

                const opfsOk=
                    results[1].status==='fulfilled'
                    &&results[1].value!==false;

                if(!dbOk&&!opfsOk){
                    throw new Error(
                        '草稿本地持久化失败'
                    );
                }
            });

    return draftWriteChain;
}

async function saveAddDraftLocal(force=false){
    if(!unlocked){
        return false;
    }

    if(!addDraftHasChanges()){
        if(addDraftLastSnapshot){
            await clearAddDraft();
        }

        return false;
    }

    const snapshot=
        addDraftSnapshot();

    if(
        !force
        &&snapshot===addDraftLastSnapshot
    ){
        return true;
    }

    try{
        const record=
            await buildAddDraftRecord();

        addDraftLastSnapshot=
            snapshot;

        await enqueueDraftWrite(
            ADD_DRAFT_KEY,
            ADD_DRAFT_OPFS_FILE,
            record
        );

        return true;
    }catch(error){
        console.error(
            '新增草稿自动保存失败',
            error
        );

        return false;
    }
}

async function saveEditDraftLocal(force=false){
    if(
        editModal.classList.contains('hidden')
        ||!editingId
    ){
        return false;

    if(!editDraftHasChanges()){
        if(editDraftLastSnapshot){
            await clearEditDraft();

        return false;
    }

    const snapshot=
        editDraftSnapshot();

    if(
        !force
        &&snapshot===editDraftLastSnapshot
    ){
        return true;
    }

    try{
        const record=
            await buildEditDraftRecord();

        editDraftLastSnapshot=

        await enqueueDraftWrite(

        editContent,
        mergeLegacyTitleIntoContent(
            draft?.title,
            String(draft?.content??'')

    );

    editDraftLastSnapshot=
        editDraftSnapshot();

    return true;
}

async function restoreMemoDraftsIfAny(){
    if(
        !unlocked
        ||draftsRestoredThisSession
    ){
        return false;
    }

    draftsRestoredThisSession=true;

    const[
        addRecord,
        editRecord
    ]=await Promise.all([
        readBestDraftRecord(
            ADD_DRAFT_KEY,
            ADD_DRAFT_OPFS_FILE
        ),
        readBestDraftRecord(
            EDIT_DRAFT_KEY,
            EDIT_DRAFT_OPFS_FILE
        )
    ]);

    let restoredAdd=false;
    let restoredEdit=false;

    if(
        addRecord?.kind==='draft'
        &&addRecord.draft?.mode==='add'
    ){
        await applyAddDraft(
            addRecord.draft
        );

        restoredAdd=true;
    }

    if(
        editRecord?.kind==='draft'
        &&editRecord.draft?.mode==='edit'
    ){
        restoredEdit=
            await applyEditDraft(
                editRecord.draft
            );

        if(
            !restoredEdit
            &&!restoredAdd
        ){
            await applyAddDraft({
                ...editRecord.draft,
                mode:'add'
            });

            restoredAdd=true;
        }
    }

    if(restoredAdd&&restoredEdit){
        show(
            '已恢复上次未提交的新增草稿和编辑草稿',
            'info'
        );
    }else if(restoredEdit){
        show(
            '已恢复上次未提交的编辑草稿',
            'info'
        );
    }else if(restoredAdd){
        show(
            '已恢复上次未提交的草稿',
            'info'
        );
    }

    return restoredAdd||restoredEdit;
}

/* =========================
   GitHub API
   ========================= */

async function githubApi(method,endpoint='',body=null){
    const owner=
        encodeURIComponent(
            config.owner
        );

    const repo=
        encodeURIComponent(
            config.repo
        );

    const suffix=
        endpoint
            ? `/${endpoint}`
            : '';

    const url=
        `https://api.github.com/repos/${owner}/${repo}${suffix}`;

    const headers={
        'Authorization':
            `Bearer ${config.token}`,
        'Accept':
            'application/vnd.github+json',
        'X-GitHub-Api-Version':
            API_VERSION
    };

    const options={
        method,
        headers
    };

    if(body!==null){
        headers['Content-Type']=
            'application/json';

        options.body=
            JSON.stringify(body);
    }

    const response=
        await fetch(
            url,
            options
        );

    const raw=
        await response.text();

    let data=null;

    if(raw){
        try{
            data=JSON.parse(raw);
        }catch(error){
            data={
                message:raw
            };
        }
    }

    if(!response.ok){
        const error=
            new Error(
                data?.message
                ||`HTTP ${response.status}`
            );

        error.status=response.status;
        error.payload=data;

        throw error;
    }

    return data;
}

function utf8ToBase64(text){
    const bytes=
        new TextEncoder()
            .encode(text);

    let binary='';

    for(
        let i=0;
        i<bytes.length;
        i+=0x8000
    ){
        binary+=
            String.fromCharCode(
                ...bytes.subarray(
                    i,
                    i+0x8000
                )
            );
    }

    return btoa(binary);
}

function base64ToUtf8(base64){
    const binary=
        atob(
            String(base64||'')
                .replace(/\s/g,'')
        );

    const bytes=
        new Uint8Array(
            binary.length
        );

    for(
        let i=0;
        i<binary.length;
        i++
    ){
        bytes[i]=
            binary.charCodeAt(i);
    }

    return new TextDecoder('utf-8')
        .decode(bytes);
}

async function verifyRepository(){
    return githubApi('GET');
}

async function readRemote(){
    try{
        const data=
            await githubApi(
                'GET',
                `contents/${pathEncode(config.file)}`
            );

        if(
            !data
            ||data.type!=='file'
            ||typeof data.content!=='string'
            ||!data.sha
        ){
            throw new Error(
                '云端数据文件格式异常'
            );
        }

        if(
            Number.isFinite(data.size)
            &&data.size>MAX_BYTES
        ){
            throw new Error(
                '云端数据超过 750 KB'
            );
        }

        const parsed=
            JSON.parse(
                base64ToUtf8(
                    data.content
                )
            );

        return{
            exists:true,
            sha:data.sha,
            state:normalizeState(parsed)
        };
    }catch(error){
        if(error.status===404){
            return{
                exists:false,
                sha:null,
                state:[]
            };
        }

        throw error;
    }
}

async function writeRemote(snapshot,sha){
    const normalized=
        normalizeState(snapshot);

    const raw=
        JSON.stringify(
            {
                schemaVersion:4,
                entries:normalized
            },
            null,
            2
        );

    if(
        new TextEncoder()
            .encode(raw)
            .length>MAX_BYTES
    ){
        throw new Error(
            '数据超过 750 KB'
        );
    }

    const body={
        message:
            `更新 Memo 数据 - ${new Date().toLocaleString()}`,
        content:utf8ToBase64(raw)
    };

    if(sha){
        body.sha=sha;
    }

    const result=
        await githubApi(
            'PUT',
            `contents/${pathEncode(config.file)}`,
            body
        );

    return result?.content?.sha
        ||null;
}

/* =========================
   旧附件清理兼容
   ========================= */

function attachmentBaseDir(){
    const file=
        clean(config.file)
        ||PUBLIC_DATA_FILE;

    const normalized=
        file
            .replace(/\\/g,'/')
            .replace(/^\/+|\/+$/g,'');

    const slash=
        normalized.lastIndexOf('/');

    return slash>=0
        ? normalized.slice(0,slash)
        : '';
}

async function deleteRepoTree(repoPath){
    let data;

    try{
        data=
            await githubApi(
                'GET',
                `contents/${pathEncode(repoPath)}`
            );
    }catch(error){
        if(error.status===404){
            return;
        }

        throw error;
    }

    const items=
        Array.isArray(data)
            ? data
            : [data];

    for(const item of items){
        if(item?.type==='dir'){
            await deleteRepoTree(
                item.path
            );
        }else if(
            item?.type==='file'
            &&item.sha
            &&item.path
        ){
            await githubApi(
                'DELETE',
                `contents/${pathEncode(item.path)}`,
                {
                    message:
                        `删除 Memo 旧附件 ${item.path}`,
                    sha:item.sha
                }
            );
        }
    }
}

async function deleteAttachmentFolder(folder){
    const valid=
        normalizeAttachmentFolder(folder);

    if(valid===null){
        return;
    }

    await deleteRepoTree(
        [
            attachmentBaseDir(),
            String(valid)
        ]
            .filter(Boolean)
            .join('/')
    );
}
